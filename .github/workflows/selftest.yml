name: selftest

# The whole point of this kit is "verify, don't assume" — including the tools
# themselves. This workflow runs the same checks a user should run locally.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax
        run: |
          fail=0
          for f in $(find . -name '*.py' -not -path './.git/*'); do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              && echo "  ok   $f" || { echo "  FAIL $f"; fail=1; }
          done
          exit $fail

      - name: Shell syntax
        run: |
          fail=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            bash -n "$f" && echo "  ok   $f" || { echo "  FAIL $f"; fail=1; }
          done
          exit $fail

      - name: Every tracked .json parses (not just templates/)
        # This exists because examples/research/facts.json shipped as a Markdown
        # document with a ```json fence inside, while four docs described it as the
        # "machine-readable fact base". A templates/-only glob never caught it.
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              echo "  ok   $f"
            else
              echo "  FAIL $f is not valid JSON"; fail=1
            fi
          done < <(git ls-files -z '*.json')
          exit $fail

      - name: --help works on every tool
        run: |
          # Keep this list in step with the kit. It previously named six tools and
          # silently ignored the six added in 1.1.0/1.2.0, so a new tool could ship
          # with a broken CLI and no CI signal at all.
          fail=0
          listed="scan/repo_scan.py qa/qa_wiki.py qa/fix_toc.py qa/verify_commands.py \
                  scaffold/new_page.py probe/webapp_probe.py \
                  lib/req.py lib/serve.py lib/evidence.py lib/session.py \
                  setup/check_runtime.py"
          for f in $listed; do
            python3 "$f" --help >/dev/null 2>&1 \
              && echo "  ok   $f" || { echo "  FAIL $f"; fail=1; }
          done
          # every .py in the kit must be either exercised above or explicitly excused
          for f in $(git ls-files '*.py'); do
            case " $listed " in
              *" $f "*) ;;
              *) echo "  NOTE $f is not in the --help list — add it or say why";;
            esac
          done
          exit $fail

      - name: QA self-test (the checker must be able to fail)
        run: python3 qa/qa_wiki.py --self-test

      - name: Self-tests of the tools added in 1.1.0/1.2.0
        run: |
          # None of these were in CI when they landed, which is how a vacuous
          # assertion and a broken fallback path survived a green build.
          fail=0
          python3 qa/fix_toc.py --self-test \
            && echo "  ok   qa/fix_toc.py" || { echo "  FAIL qa/fix_toc.py"; fail=1; }
          python3 lib/evidence.py --self-test \
            && echo "  ok   lib/evidence.py" || { echo "  FAIL lib/evidence.py"; fail=1; }
          # session.py's self-test needs a live PHP server, so only its CLI is
          # checked here; the live run is a Phase-1 task, not a CI task.
          python3 lib/session.py --help >/dev/null 2>&1 \
            && echo "  ok   lib/session.py (CLI; live run is Phase 1)" \
            || { echo "  FAIL lib/session.py"; fail=1; }
          exit $fail

      - name: Scaffold round-trip (scaffold output must be QA-clean)
        run: |
          # Both grouping branches are exercised on purpose. The explicit-grouping
          # branch (`--progress` / `--groups`) used to return before writing
          # `_Footer.md`, and this step could not see it: it drove only the heuristic
          # path, and a missing footer is a warning rather than an error, so
          # `--strict` stayed green while the skeleton shipped incomplete.
          set -e
          for pages in "Home,Getting Started,Glossary" \
                       "Home,Architecture,Security Hardening Guide,FAQ,Troubleshooting" \
                       "Home"; do
            rm -rf /tmp/rt
            python3 scaffold/new_page.py /tmp/rt --init --project RT --pages "$pages" >/dev/null
            python3 qa/qa_wiki.py /tmp/rt --strict
            # the skeleton is only complete with chrome on every grouping path
            for f in Home.md _Sidebar.md _Footer.md; do
              [ -f "/tmp/rt/$f" ] || { echo "  FAIL heuristic scaffold lacks $f"; exit 1; }
            done
            echo "  ok   [$pages]"
          done
          # explicit grouping from --groups
          rm -rf /tmp/rtg
          python3 scaffold/new_page.py /tmp/rtg --init --project RT \
            --groups 'Overview:Home,Getting Started|Usage:Research and Probing Guide|Reference:Glossary' >/dev/null
          python3 qa/qa_wiki.py /tmp/rtg --strict
          for f in Home.md _Sidebar.md _Footer.md; do
            [ -f "/tmp/rtg/$f" ] || { echo "  FAIL --groups scaffold lacks $f"; exit 1; }
          done
          echo "  ok   [--groups]"
          # explicit grouping from --progress, which is the preferred source
          rm -rf /tmp/rtp
          python3 - <<'PY'
          import json, pathlib
          pathlib.Path('/tmp/rtp').mkdir(parents=True, exist_ok=True)
          pathlib.Path('/tmp/rtp/PROGRESS.json').write_text(json.dumps({
              "project": "RT",
              "pages": [{"title": "Home", "group": "Overview"},
                        {"title": "Getting Started", "group": "Overview"},
                        {"title": "Glossary", "group": "Reference"}]}), encoding="utf-8")
          PY
          python3 scaffold/new_page.py /tmp/rtp/out --init --project RT --progress /tmp/rtp/PROGRESS.json >/dev/null
          python3 qa/qa_wiki.py /tmp/rtp/out --strict
          for f in Home.md _Sidebar.md _Footer.md; do
            [ -f "/tmp/rtp/out/$f" ] || { echo "  FAIL --progress scaffold lacks $f"; exit 1; }
          done
          echo "  ok   [--progress]"

      - name: --ban and --terms work against their own templates
        run: |
          # `set -e` is deliberately absent: command 2 below MUST find a banned
          # phrase, so a bare non-zero exit would abort the step *before* asserting
          # anything. Expectations are stated explicitly instead.
          #
          # The fixture matters as much as the assertions. qa_wiki.py blanks fenced
          # and inline code before matching (that is how the field-report false
          # positives were fixed), so a phrase placed only inside backticks can
          # never fire. Here `uses a database` is in PROSE and must fire, while
          # `save_comments` appears solely inside inline code and must stay silent —
          # both halves are asserted, so the step cannot pass vacuously.
          fail=0
          rm -rf /tmp/fix && mkdir -p /tmp/fix
          cat > "/tmp/fix/Ban Page.md" <<'EOF'
          # Ban Page

          Lead paragraph long enough to satisfy the lead-paragraph check.

          ## Body

          The subject uses a database for sessions, which the docs never mention.

          By contrast the real setting is `opcache.save_comments`, quoted from source.

          ## See also

          - [[Ban Page]]
          EOF

          # 1. the shipped template has only structural/meta keys: warn, do not fail
          if python3 qa/qa_wiki.py /tmp/fix --ban templates/ban.json --strict >/tmp/fix/out1 2>&1; then
            echo "  ok   structural-only template warns without failing"
          else
            echo "  FAIL structural-only template returned non-zero"; cat /tmp/fix/out1; fail=1
          fi
          if grep -q 'no active phrases' /tmp/fix/out1; then
            echo "  ok   the empty-template warning is emitted"
          else
            echo "  FAIL empty-template warning missing (a silent no-op ban list)"; fail=1
          fi

          # 2. a real prose ban fires; meta keys and blanked code never do
          cat > /tmp/fix/ban.json <<'EOF'
          {"_comment": ["documentation, not a phrase"],
           "uses a database": "the subject is stateless",
           "save_comments": "occurs only inside inline code in the fixture"}
          EOF
          rc=0
          python3 qa/qa_wiki.py /tmp/fix --ban /tmp/fix/ban.json --strict >/tmp/fix/out2 2>&1 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "  FAIL a real prose ban must exit 1 under --strict, got $rc"; cat /tmp/fix/out2; fail=1
          else
            echo "  ok   a real prose ban exits non-zero under --strict"
          fi
          if grep -q "banned claim 'uses a database'" /tmp/fix/out2; then
            echo "  ok   the real banned phrase fired"
          else
            echo "  FAIL the real banned phrase did not fire"; fail=1
          fi
          # A meta key reported AS a phrase reads `banned claim '_comment'`.
          # A bare grep for `_comment` would also match `save_comments`, so the
          # pattern anchors on the report prefix.
          if grep -qE "banned claim '_" /tmp/fix/out2; then
            echo "  FAIL a meta key was reported as a banned phrase"; fail=1
          else
            echo "  ok   meta keys were not treated as phrases"
          fi
          if grep -q "banned claim 'save_comments'" /tmp/fix/out2; then
            echo "  FAIL a phrase occurring only inside inline code fired"; fail=1
          else
            echo "  ok   a phrase occurring only inside inline code did not fire"
          fi
          # The template's own structural keys must never be threats.
          if grep -qE "banned claim '(exemptions|fluff_exemptions)'" /tmp/fix/out1; then
            echo "  FAIL the template bans its own structural keys"; fail=1
          else
            echo "  ok   structural keys are not treated as phrases"
          fi

          # 3. the documented combination runs clean
          if python3 qa/qa_wiki.py /tmp/fix --ban templates/ban.json --terms templates/terms.json >/tmp/fix/out3 2>&1; then
            echo "  ok   documented --ban + --terms combination runs clean"
          else
            echo "  FAIL documented --ban + --terms combination failed"; cat /tmp/fix/out3; fail=1
          fi

          if [ "$fail" -ne 0 ]; then echo "--ban/--terms expectations not met"; exit 1; fi
          echo "  all --ban/--terms expectations hold"

      - name: Every path referenced by SKILL.md and AGENTS.md exists
        run: |
          # `grep` exits 1 when a pattern merely does not occur in a document, and
          # under `bash -eo pipefail` (what `shell: bash` means) that aborted this
          # step even though nothing was missing. Candidates are collected with
          # that exit code neutralised, and existence is checked in the shell
          # rather than inside a subshell whose exit code the loop discards.
          fail=0
          for doc in SKILL.md AGENTS.md README.md; do
            md_links=$(grep -oE '\(([a-z][a-z0-9_./-]*\.(py|sh|md|json|tmpl))\)' "$doc" 2>/dev/null | tr -d '()' | sort -u) || true
            backticked=$(grep -oE '`(setup|scan|lib|probe|qa|scaffold|publish|templates)/[A-Za-z0-9_./-]+`' "$doc" 2>/dev/null | tr -d '`' | sort -u) || true
            for f in $md_links $backticked; do
              [ -z "$f" ] && continue
              if [ ! -e "$f" ]; then
                echo "  MISSING $doc -> $f"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || { echo "documented paths missing (a .gitignore rule may be dropping files)"; exit 1; }
          echo "  all documented paths exist"

      - name: No tracked file is excluded by .gitignore
        run: |
          fail=0
          for f in $(git ls-files); do
            if git check-ignore -q "$f"; then
              echo "  IGNORED: $f  <- $(git check-ignore -v "$f" | cut -f1)"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "a tracked file matches .gitignore — a copy-based publish would silently drop it"; exit 1; }
          echo "  ok: 0 of $(git ls-files | wc -l) tracked files are ignored"

      - name: No run workspace is staged into the kit
        run: |
          # A run's working directory (uploads, a scratch copy of the kit, bundles)
          # must never be published. Caught because a `v3.2/` directory holding 184
          # files and 4.4 MB sat untracked-but-not-ignored at the repository root: a
          # `git add -A` would have pushed all of it into the public kit.
          fail=0
          for d in v3.2 workspace uploads incoming .publish; do
            if [ -e "$d" ] && ! git check-ignore -q "$d"; then
              echo "  FAIL $d/ exists and is NOT ignored"; fail=1
            fi
          done
          # belt and braces: nothing staged may look like a run artefact
          if git ls-files | grep -qE '^(v3\.[0-9]+|workspace|uploads)/'; then
            echo "  FAIL run-workspace paths are tracked:"; git ls-files | grep -E '^(v3\.[0-9]+|workspace|uploads)/' | head; fail=1
          fi
          [ $fail -eq 0 ] || { echo "a run workspace would be published with the kit"; exit 1; }
          echo "  ok: no run-workspace directory is tracked or stageable"

      - name: Audit the examples wiki (must stay at zero errors)
        run: |
          if [ -d examples/wiki ]; then
            python3 qa/qa_wiki.py examples/wiki --strict
          else
            echo "  (no examples/wiki — skipped)"
          fi
